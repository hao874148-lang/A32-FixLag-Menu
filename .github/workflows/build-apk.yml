name: Build and Fix Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Restructure Project & Fix Gradle Errors
        run: |
          echo "Đang tạo cấu trúc thư mục chuẩn của Android..."
          mkdir -p app/src/main/java/com/a32/fixlag
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-hdpi

          echo "Đang di chuyển các file nguồn vào đúng vị trí..."
          # Di chuyển file Java vào package com.a32.fixlag
          for f in *.java; do
            [ -f "$f" ] && mv "$f" app/src/main/java/com/a32/fixlag/
          done

          # Di chuyển AndroidManifest.xml
          if [ -f "AndroidManifest.xml" ]; then
            mv AndroidManifest.xml app/src/main/
          fi

          # Di chuyển các file XML tài nguyên
          for f in *.xml; do
            if [ "$f" == "AndroidManifest.xml" ]; then continue; fi
            if [ -f "$f" ]; then
              # Phân loại XML vào thư mục res tương ứng
              case "$f" in
                strings.xml|colors.xml|themes.xml|styles.xml|array.xml|ids.xml|dimens.xml)
                  mv "$f" app/src/main/res/values/
                  ;;
                activity_*.xml|fragment_*.xml|item_*.xml|dialog_*.xml|view_*.xml)
                  mv "$f" app/src/main/res/layout/
                  ;;
                *)
                  mv "$f" app/src/main/res/drawable/
                  ;;
              esac
            fi
          done

          echo "Đang ghi đè settings.gradle để loại bỏ lỗi Groovy DSL..."
          cat <<EOF > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "A32-FixLag-Menu"
          include ':app'
          EOF

          echo "Đang cấu hình lại build.gradle cho App Module..."
          # Nếu app/build.gradle không tồn tại nhưng có build.gradle ở root, ta chuyển nó vào app/
          if [ ! -f "app/build.gradle" ] && [ -f "build.gradle" ]; then
            mv build.gradle app/build.gradle
          fi
          
          # Đảm bảo AGP sử dụng phiên bản 8.1.1 tương thích
          if [ -f "app/build.gradle" ]; then
            sed -i 's/com.android.tools.build:gradle:[^ ]*/com.android.tools.build:gradle:8.1.1/' app/build.gradle
            sed -i 's/id "com.android.application" version "[^"]*"/id "com.android.application" version "8.1.1"/g' app/build.gradle
          fi

          # Tạo root build.gradle nếu nó bị mất hoặc chuyển nhầm
          if [ ! -f "build.gradle" ]; then
            cat <<EOF > build.gradle
          plugins {
              id 'com.android.application' version '8.1.1' apply false
          }
          EOF
          fi

      - name: 4. Setup Gradle Wrapper 8.5
        # Khởi tạo wrapper phiên bản 8.5 tương thích hoàn toàn với AGP 8.1.1
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: 5. Build APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 6. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: A32-FixLag-Menu-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
