name: Build and Fix Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: 4. Restructure Project & Overwrite Gradle Configs
        run: |
          python3 << 'PY_SCRIPT'
          import os, shutil

          print("Xóa sạch các file cấu hình Gradle cũ...")
          for f in ['settings.gradle', 'build.gradle', 'app/build.gradle', 'gradle.properties', 'local.properties']:
              if os.path.exists(f): os.remove(f)
          if os.path.exists('.gradle'): shutil.rmtree('.gradle')

          print("Tạo cấu trúc thư mục chuẩn...")
          dirs = ['app/src/main/java/com/a32/fixlag', 'app/src/main/res/values', 'app/src/main/res/layout', 'app/src/main/res/drawable', 'app/src/main/res/mipmap-hdpi']
          for d in dirs: os.makedirs(d, exist_ok=True)

          print("Di chuyển file nguồn...")
          for f in os.listdir('.'):
              if f.endswith('.java'):
                  shutil.move(f, f'app/src/main/java/com/a32/fixlag/{f}')
              elif f == 'AndroidManifest.xml':
                  shutil.move(f, 'app/src/main/AndroidManifest.xml')
              elif f.endswith('.xml'):
                  if f in ['strings.xml', 'colors.xml', 'themes.xml', 'styles.xml', 'array.xml', 'ids.xml', 'dimens.xml']:
                      shutil.move(f, f'app/src/main/res/values/{f}')
                  elif f.startswith(('activity_', 'fragment_', 'item_', 'dialog_', 'view_')):
                      shutil.move(f, f'app/src/main/res/layout/{f}')
                  else:
                      shutil.move(f, f'app/src/main/res/drawable/{f}')

          print("Tạo mới settings.gradle (Không có repositoriesMode)...")
          with open('settings.gradle', 'w') as f:
              f.write("""pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "A32-FixLag-Menu"
          include ':app'
          """)

          print("Tạo mới root build.gradle...")
          with open('build.gradle', 'w') as f:
              f.write("""plugins {
              id 'com.android.application' version '8.1.1' apply false
          }
          """)

          print("Tạo mới app/build.gradle...")
          os.makedirs('app', exist_ok=True)
          with open('app/build.gradle', 'w') as f:
              f.write("""plugins {
              id 'com.android.application'
          }

          android {
              namespace "com.a32.fixlag"
              compileSdk 34

              defaultConfig {
                  applicationId "com.a32.fixlag"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          """)
          print("Hoàn tất cấu trúc lại dự án!")
          PY_SCRIPT

      - name: 5. Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 6. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: A32-FixLag-Menu-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
