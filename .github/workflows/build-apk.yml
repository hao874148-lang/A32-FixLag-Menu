name: Build and Fix Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Restructure Project & Overwrite Gradle Configs
        run: |
          echo "Xóa sạch các file cấu hình Gradle cũ gây lỗi..."
          rm -f settings.gradle build.gradle gradle.properties local.properties
          rm -rf gradle/
          rm -f gradlew gradlew.bat
          
          echo "Tạo cấu trúc thư mục chuẩn của Android..."
          mkdir -p app/src/main/java/com/a32/fixlag
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-hdpi

          echo "Di chuyển các file nguồn vào đúng vị trí..."
          # Di chuyển file Java vào package com.a32.fixlag
          for f in *.java; do
            [ -f "$f" ] && mv "$f" app/src/main/java/com/a32/fixlag/
          done

          # Di chuyển AndroidManifest.xml
          if [ -f "AndroidManifest.xml" ]; then
            mv AndroidManifest.xml app/src/main/
          fi

          # Di chuyển các file XML tài nguyên
          for f in *.xml; do
            if [ "$f" == "AndroidManifest.xml" ]; then continue; fi
            if [ -f "$f" ]; then
              case "$f" in
                strings.xml|colors.xml|themes.xml|styles.xml|array.xml|ids.xml|dimens.xml)
                  mv "$f" app/src/main/res/values/
                  ;;
                activity_*.xml|fragment_*.xml|item_*.xml|dialog_*.xml|view_*.xml)
                  mv "$f" app/src/main/res/layout/
                  ;;
                *)
                  mv "$f" app/src/main/res/drawable/
                  ;;
              esac
            fi
          done

          echo "Tạo mới file settings.gradle..."
          echo 'pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "A32-FixLag-Menu"
          include ":app"' > settings.gradle

          echo "Tạo mới file build.gradle (Root)..."
          echo 'plugins {
              id "com.android.application" version "8.1.1" apply false
          }' > build.gradle

          echo "Tạo mới file app/build.gradle..."
          echo 'plugins {
              id "com.android.application"
          }

          android {
              namespace "com.a32.fixlag"
              compileSdk 34

              defaultConfig {
                  applicationId "com.a32.fixlag"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }' > app/build.gradle

      - name: 4. Setup Gradle Wrapper 8.5
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: 5. Build APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 6. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: A32-FixLag-Menu-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
