name: Auto-Structure and Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Reorganize Flat Files to Android Project Structure
      run: |
        echo "=== Tự động sắp xếp cấu trúc thư mục Android ==="
        
        # 1. Tạo cây thư mục chuẩn
        mkdir -p app/src/main/java/com/a32/fixlag/commands
        mkdir -p app/src/main/java/com/a32/fixlag/data
        mkdir -p app/src/main/java/com/a32/fixlag/shizuku
        mkdir -p app/src/main/java/com/a32/fixlag/ui
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/menu
        mkdir -p app/src/main/res/values

        # 2. Di chuyển các file Java vào package phù hợp
        mv Application.java app/src/main/java/com/a32/fixlag/ 2>/dev/null || true
        mv ShizukuManager.java ShellExecutor.java app/src/main/java/com/a32/fixlag/shizuku/ 2>/dev/null || true
        mv AppPreferences.java SystemMonitor.java app/src/main/java/com/a32/fixlag/data/ 2>/dev/null || true
        mv CommandRegistry.java CpuGpuCommands.java DisplayCommands.java RamCommands.java app/src/main/java/com/a32/fixlag/commands/ 2>/dev/null || true
        mv MainActivity.java DashboardFragment.java MenuFixLagFragment.java app/src/main/java/com/a32/fixlag/ui/ 2>/dev/null || true

        # 3. Di chuyển Manifest và Tài nguyên XML
        mv AndroidManifest.xml app/src/main/ 2>/dev/null || true
        mv activity_main.xml fragment_dashboard.xml fragment_menu.xml app/src/main/res/layout/ 2>/dev/null || true
        mv bottom_nav_menu.xml app/src/main/res/menu/ 2>/dev/null || true
        mv colors.xml strings.xml app/src/main/res/values/ 2>/dev/null || true

        # 4. Xử lý file build.gradle module app
        # Nếu có file build.gradle trùng tên, di chuyển 1 file vào app/
        if [ -f "build (1).gradle" ]; then
          mv "build (1).gradle" app/build.gradle
        elif [ ! -f "app/build.gradle" ]; then
          # Tạo app/build.gradle nếu bị thiếu
          cat << 'EOF' > app/build.gradle
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.a32.fixlag'
    compileSdk 34

    defaultConfig {
        applicationId "com.a32.fixlag"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'dev.rikka.shizuku:api:13.1.0'
    implementation 'dev.rikka.shizuku:provider:13.1.0'
}
EOF
        fi

        # 5. Đảm bảo Root build.gradle tồn tại
        if [ ! -f "build.gradle" ]; then
          cat << 'EOF' > build.gradle
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.1'
    }
}
task clean(type: Delete) {
    delete rootProject.buildDir
}
EOF
        fi

        echo "=== Cấu trúc thư mục sau khi sắp xếp ==="
        find . -maxdepth 5 -not -path '*/.*'

    - name: Setup Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.0

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FixLag-A32-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
